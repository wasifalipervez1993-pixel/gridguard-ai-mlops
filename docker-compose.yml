services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridguard-api
    env_file:
      - .env
    environment:
      MODEL_DIR: /app/artifacts
      ENVIRONMENT: docker
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: gridguard-dashboard
    environment:
      API_URL: http://api:8000
      MODEL_DIR: /app/artifacts
      ENVIRONMENT: docker
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: gridguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
