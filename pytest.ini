[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
markers =
    unit: isolated unit tests
    contract: data/model/API contract tests
    integration: tests that load API, model registry, and model artifacts
    governance: model governance and anti-hardcoding tests
    dashboard: dashboard syntax/static tests
    slow: slower tests that may read larger local artifacts
filterwarnings =
    ignore:Using extra keyword arguments on `Field` is deprecated.*
