name: GridGuard AI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test and validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest httpx ruff

      - name: Lint source with Ruff
        run: |
          ruff check src scripts dashboard tests

      - name: Run tests
        env:
          MODEL_DIR: artifacts
          ENVIRONMENT: ci
        run: |
          python -m pytest -q

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build API image
        run: docker build -t gridguard-api:ci -f Dockerfile .

      - name: Build dashboard image
        run: docker build -t gridguard-dashboard:ci -f Dockerfile.dashboard .
