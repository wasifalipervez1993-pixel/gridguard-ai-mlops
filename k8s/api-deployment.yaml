apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridguard-api
  namespace: gridguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gridguard-api
  template:
    metadata:
      labels:
        app: gridguard-api
    spec:
      containers:
        - name: api
          image: your-dockerhub-username/gridguard-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "kubernetes"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: gridguard-secrets
                  key: MONGODB_URI
            - name: MONGODB_DB
              value: "gridguard"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
